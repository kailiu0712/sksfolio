[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sksfolio"
dynamic = ["version"]
description = "Sparse k-support portfolio relaxations with safe dual bounds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "osqp>=1.0",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
native-dev = ["Cython==3.1.3"]

[project.scripts]
sksfolio-bnb = "sksfolio.benchmarks.run_bnb:main"
sksfolio-corrected-benchmark = "sksfolio.benchmarks.run_corrected_algorithms:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sksfolio*"]
exclude = ["outputs*", "tests*", "benchmarks*"]

[tool.setuptools.dynamic]
version = {attr = "sksfolio._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["numerical: numerical regression rather than a pure unit test"]
