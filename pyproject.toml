[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsefolio-experiments"
version = "0.1.0"
description = "Sparse portfolio root relaxations with exposure constraints"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12", "numba>=0.60", "threadpoolctl>=3.1"]

[project.optional-dependencies]
mosek = ["Mosek>=11.2"]

[project.scripts]
sparsefolio = "sparsefolio.__main__:main"

[tool.setuptools.packages.find]
include = ["sparsefolio*"]
